<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Agent Office 3D</title>
<style>
  :root { --ink: #1f2430; --card: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #8b82c4, #5d548f 70%); font-family: system-ui, "Segoe UI", sans-serif; color: var(--ink); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }
  .card { position: fixed; background: var(--card); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 10px 14px; }
  #title { top: 14px; left: 14px; max-width: 280px; }
  #title h1 { margin: 0 0 4px; font-size: 16px; }
  #title p { margin: 0; font-size: 12px; color: #55606e; line-height: 1.4; }
  #workers { top: 14px; right: 14px; width: 270px; bottom: 14px; overflow: auto; }
  #ctoggle { margin-top: 8px; border: 2px solid var(--ink); border-radius: 8px; background: #bff0d4; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; padding: 3px 10px; }
  #center { top: 150px; left: 14px; width: 300px; max-height: calc(100% - 520px); min-height: 160px; overflow: auto; }
  #center[hidden] { display: none; }
  #ctabs { display: flex; gap: 4px; margin-bottom: 8px; }
  #ctabs button { flex: 1; border: 2px solid var(--ink); border-radius: 8px; background: #fff; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; padding: 3px; }
  #ctabs button.on { background: #ffe8a8; }
  .crow { font-size: 12px; padding: 5px 0; border-top: 1px solid #eef0f4; display: flex; gap: 6px; align-items: center; }
  .crow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow small { color: #8a93a0; }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 7px; border: 2px solid var(--ink); border-radius: 99px; background: #ffe8a8; }
  .tag.done { background: #bff0d4; } .tag.failed { background: #ffc4c4; }
  .crow button { border: 2px solid var(--ink); border-radius: 8px; background: #fff; font-size: 11px; font-weight: 700; cursor: pointer; }
  .crow pre { margin: 4px 0 0; white-space: pre-wrap; font: 11px/1.4 ui-monospace, Consolas, monospace; max-height: 120px; overflow: auto; background: #f6f8fa; padding: 4px; border-radius: 6px; }
  #workers h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 4px; border-top: 1px solid #e4e8ee; cursor: pointer; }
  #list li:hover { background: #f3f6fa; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: #9aa3ad; }
  .working .dot { background: #2fbf71; } .waiting .dot { background: #f5b82e; }
  .role { font-weight: 700; font-size: 13px; }
  .task { grid-column: 2; font-size: 11px; color: #667080; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 14px; }
  .pill { grid-row: 1; grid-column: 3; font-size: 10px; font-weight: 700; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 99px; background: #e6e9ee; text-transform: uppercase; }
  .working .pill { background: #bff0d4; } .waiting .pill { background: #ffe8a8; }
  #detail { left: 14px; bottom: 60px; width: 290px; }
  #detail[hidden] { display: none; }
  #detail h3 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; }
  #detail button { border: 2px solid var(--ink); background: #fff; border-radius: 8px; cursor: pointer; font-weight: 700; }
  #events { list-style: none; margin: 0; padding: 0; font-size: 12px; max-height: 240px; overflow: auto; }
  #events li { padding: 3px 0; border-top: 1px solid #eef0f4; }
  #events time { color: #8a93a0; margin-right: 6px; }
  #result { left: 50%; bottom: 84px; transform: translateX(-50%); width: min(560px, calc(100% - 340px)); max-height: 40vh; overflow: auto; }
  #result[hidden] { display: none; }
  #result h3 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; }
  #result button { border: 2px solid var(--ink); background: #fff; border-radius: 8px; cursor: pointer; font-weight: 700; }
  #rtext { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  #chips { position: absolute; left: 8px; bottom: calc(100% + 6px); display: flex; flex-wrap: wrap; gap: 4px; max-width: 100%; }
  .chip { background: #fff; border: 2px solid var(--ink); border-radius: 99px; padding: 1px 4px 1px 10px; font-size: 11px; font-weight: 600; }
  .chip button { border: 0; background: none; cursor: pointer; font-weight: 700; }
  #prompt.drag { background: #e5f6ff; }
  #prompt { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(560px, calc(100% - 340px)); display: flex; gap: 8px; padding: 8px; }
  #prompt input { flex: 1; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; }
  #prompt button { border: 2px solid var(--ink); border-radius: 8px; background: #bff0d4; font-weight: 700; padding: 0 14px; cursor: pointer; }
  #prompt button:disabled { background: #e6e9ee; cursor: wait; }
  #connbox { left: 14px; bottom: 14px; padding: 6px 12px; font-size: 12px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  #hq { border: 2px solid var(--ink); border-radius: 8px; background: #fff; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; }
  #connbox .dot { background: #e5484d; } #connbox.on .dot { background: #2fbf71; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="card" id="title">
  <h1>Virtual Agent Office 3D</h1>
  <p>Kéo chuột để xoay · cuộn để zoom · click nhân vật để xem chi tiết. Thêm <b>?demo=1</b> để chạy mô phỏng.</p>
  <button id="ctoggle" type="button">Command Center</button>
</div>

<div class="card" id="center" hidden>
  <div id="ctabs"><button data-t="tasks">Tasks</button><button data-t="approvals">Duyệt <b id="abadge"></b></button><button data-t="log">Hoạt động</button></div>
  <div id="cbody"></div>
</div>

<div class="card" id="workers"><h2>WORKERS <span id="count"></span></h2><ul id="list"></ul></div>

<div class="card" id="detail" hidden>
  <h3><span id="dname"></span><button id="dclose" title="Đóng">✕</button></h3>
  <ul id="events"></ul>
</div>

<div class="card" id="result" hidden><h3><span id="rtitle">Kết quả</span><button id="rclose" title="Đóng">✕</button></h3><pre id="rtext"></pre></div>

<form class="card" id="prompt"><div id="chips"></div><button type="button" id="pattach" title="Đính kèm file văn bản (hoặc kéo thả vào đây)">📎</button><input type="file" id="pfile" multiple hidden><input id="ptext" placeholder="Giao việc cho Claude Code… (Enter để gửi)" autocomplete="off"><button id="psend">Gửi</button></form>

<div class="card" id="connbox"><span class="dot"></span><span id="conn">Đang kết nối…</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script src="app.js"></script>
</body>
</html>
